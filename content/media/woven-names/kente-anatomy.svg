<rect x="330" y="470" width="580" height="40" fill="#201b15"/>
<g stroke="#ece2c8" stroke-width="4" fill="none">
<path d="M350 490 h60 M430 480 v20 M450 480 v20 M470 480 v20 M510 490 h60 M600 480 v20 M620 480 v20 M640 480 v20 M680 490 h60 M760 480 v20 M780 480 v20 M800 480 v20 M840 490 h50"/>
</g>
</g>

<!-- 라벨 좌측 -->
<g font-size="19" fill="#1a1916">
<line x1="330" y1="110" x2="240" y2="110" stroke="#8a857a" stroke-width="2"/>
<text x="228" y="106" text-anchor="end">세로 스트립</text>
<text x="228" y="130" text-anchor="end" font-size="15" fill="#8a857a">좁은 띠의 반복 — 폭·개수는 실측 분포</text>

<line x1="330" y1="208" x2="240" y2="208" stroke="#8a857a" stroke-width="2"/>
<text x="228" y="204" text-anchor="end">경사 줄무늬</text>
<text x="228" y="228" text-anchor="end" font-size="15" fill="#8a857a">천의 바탕 — 침식·변형되지 않는 층</text>

<line x1="330" y1="300" x2="240" y2="300" stroke="#8a857a" stroke-width="2"/>
<text x="228" y="296" text-anchor="end">위사 블록</text>
<text x="228" y="320" text-anchor="end" font-size="15" fill="#8a857a">배색 리듬 — 금 우세, 인접 동일색 금지</text>

<line x1="330" y1="490" x2="240" y2="490" stroke="#8a857a" stroke-width="2"/>
<text x="228" y="486" text-anchor="end">경계 모티프</text>
<text x="228" y="510" text-anchor="end" font-size="15" fill="#8a857a">Akyem · Atwedeε · Babadua</text>
<text x="228" y="530" text-anchor="end" font-size="15" fill="#8a857a">구조 전용, 의미 없음이 문헌으로 확인된 것만</text>
</g>

<!-- 라벨 우측 -->
<g font-size="19" fill="#1a1916">
<line x1="910" y1="300" x2="1000" y2="300" stroke="#8a857a" stroke-width="2"/>
<text x="1012" y="296">본문 모티프</text>
<text x="1012" y="320" font-size="15" fill="#8a857a">문헌 검증 어휘의 인용 — 뜻이 있는 자리</text>
<text x="1012" y="340" font-size="15" fill="#8a857a">직접 번역 문양이 중심에 온다</text>

<line x1="910" y1="160" x2="1000" y2="160" stroke="#8a857a" stroke-width="2"/>
<text x="1012" y="156">금지 규칙</text>
<text x="1012" y="180" font-size="15" fill="#8a857a">장례 배색(빨강+검정 지배) 출력 안 함</text>
<text x="1012" y="200" font-size="15" fill="#8a857a">왕실 이력 문양은 어휘에서 제외</text>
</g>

<text x="620" y="580" text-anchor="middle" font-size="17" fill="#5a554c">구조(스트립 폭·블록 비율·배색 통계)는 실물 측정값을 따르므로 임의 설계가 아니다</text>
<text x="620" y="608" text-anchor="middle" font-size="15" fill="#a89f8d">※ 위 그림은 설명용 재작도이며, 실물 사진·실측 데이터는 별도 부록에 수록</text>
</svg>

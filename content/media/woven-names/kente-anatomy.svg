<rect x="685" y="286" width="100" height="5"/>
<rect x="785" y="226" width="125" height="5"/><rect x="785" y="346" width="125" height="5"/>
</g>
<!-- 본문 모티프 -->
<g stroke="#ece2c8" stroke-width="4.5" fill="none">
<path d="M352 130 h76 M352 152 h76 M352 174 h76"/>
<path d="M355 250 l15 16 l15 -16 l15 16 l15 -16 l15 16 l15 -16"/>
<path d="M355 280 l15 16 l15 -16 l15 16 l15 -16 l15 16 l15 -16"/>
<path d="M470 300 l32 -32 l32 32 l-32 32 z"/>
<path d="M482 300 l20 -20 l20 20 l-20 20 z"/>

<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="720" viewBox="0 0 1240 720" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif">
<rect width="1240" height="720" fill="#ffffff"/>
<!-- 단계 헤더 -->
<g fill="#8a857a" font-size="19">
<text x="120" y="52" text-anchor="middle" fill="#1a1916" font-size="21">1. 이름 입력 · 뜻 확정</text>
<text x="120" y="76" text-anchor="middle">뜻의 결정권은 관객</text>
<text x="440" y="52" text-anchor="middle" fill="#1a1916" font-size="21">2. 뜻 묶음표 대조</text>
<text x="440" y="76" text-anchor="middle">공개된 표, 규칙으로만 판정</text>
<text x="790" y="52" text-anchor="middle" fill="#1a1916" font-size="21">3. 번역 등급</text>
<text x="790" y="76" text-anchor="middle">애매하면 아래 등급으로</text>
<text x="1105" y="52" text-anchor="middle" fill="#1a1916" font-size="21">4. 명함</text>
<text x="1105" y="76" text-anchor="middle">앞면 패턴 · 뒷면 기록</text>
</g>
<line x1="40" y1="96" x2="1200" y2="96" stroke="#ddd5c6" stroke-width="2"/>

<!-- 레인 공통: 뜻 칩 / 조건 / 등급 박스 -->
<!-- 레인 1: 직접 -->
<g>
<rect x="55" y="130" width="130" height="52" rx="26" fill="#ffffff" stroke="#1a1916" stroke-width="2.5"/>
<text x="120" y="163" text-anchor="middle" font-size="22" fill="#1a1916">가족</text>
<line x1="185" y1="156" x2="280" y2="156" stroke="#1a1916" stroke-width="2"/>
<text x="440" y="140" text-anchor="middle" font-size="18" fill="#5a554c">사전에 같은 뜻의 문양이 있음</text>
<rect x="290" y="150" width="300" height="40" rx="4" fill="#f6f3ec" stroke="#c9c2b2"/>
<text x="440" y="176" text-anchor="middle" font-size="18" fill="#1a1916">가족 = Abusua Ye Dom (가족은 힘)</text>
<line x1="590" y1="170" x2="660" y2="160" stroke="#1a1916" stroke-width="2"/>
<rect x="665" y="128" width="250" height="60" fill="#c2922e"/>
<text x="790" y="154" text-anchor="middle" font-size="21" fill="#ffffff">직접 번역</text>
<text x="790" y="177" text-anchor="middle" font-size="16" fill="#fff7e2">문양을 패턴 중심에 배치</text>
</g>
<!-- 레인 2: 인접 -->
<g>
<rect x="55" y="240" width="130" height="52" rx="26" fill="#ffffff" stroke="#1a1916" stroke-width="2.5"/>
<text x="120" y="273" text-anchor="middle" font-size="22" fill="#1a1916">명예</text>
<line x1="185" y1="266" x2="280" y2="266" stroke="#1a1916" stroke-width="2"/>
<text x="440" y="250" text-anchor="middle" font-size="18" fill="#5a554c">같은 뜻은 없지만 같은 묶음에 있음</text>
<rect x="290" y="260" width="300" height="40" rx="4" fill="#f6f3ec" stroke="#c9c2b2"/>
<text x="440" y="286" text-anchor="middle" font-size="18" fill="#1a1916">명예 ∈ {부·명예} = Sika Futuro</text>
<line x1="590" y1="280" x2="660" y2="272" stroke="#1a1916" stroke-width="2"/>
<rect x="665" y="242" width="250" height="60" fill="#d9b96a"/>
<text x="790" y="268" text-anchor="middle" font-size="21" fill="#3a3122">인접 번역</text>
<text x="790" y="291" text-anchor="middle" font-size="16" fill="#5a4c2c">문양 인용 + '인접' 표기</text>
</g>
<!-- 레인 3: 색 -->
<g>
<rect x="55" y="350" width="130" height="52" rx="26" fill="#ffffff" stroke="#1a1916" stroke-width="2.5"/>
<text x="120" y="383" text-anchor="middle" font-size="22" fill="#1a1916">이슬</text>
<line x1="185" y1="376" x2="280" y2="376" stroke="#1a1916" stroke-width="2"/>
<text x="440" y="360" text-anchor="middle" font-size="18" fill="#5a554c">문양 묶음에는 없고 색 범주에만 닿음</text>
<rect x="290" y="370" width="300" height="40" rx="4" fill="#f6f3ec" stroke="#c9c2b2"/>
<text x="440" y="396" text-anchor="middle" font-size="18" fill="#1a1916">정화·경사 계열 → fufu (흰 계열)</text>
<line x1="590" y1="390" x2="660" y2="384" stroke="#1a1916" stroke-width="2"/>
<rect x="665" y="356" width="250" height="60" fill="#9fb0b6"/>
<text x="790" y="382" text-anchor="middle" font-size="21" fill="#ffffff">색 번역</text>
<text x="790" y="405" text-anchor="middle" font-size="16" fill="#eef3f4">색 범주까지만, 뜻은 단정 안 함</text>
</g>
<!-- 레인 4: 잔여 -->
<g>
<rect x="55" y="460" width="130" height="52" rx="26" fill="#ffffff" stroke="#1a1916" stroke-width="2.5" stroke-dasharray="6 5"/>
<text x="120" y="493" text-anchor="middle" font-size="22" fill="#1a1916">그리움</text>
<line x1="185" y1="486" x2="280" y2="486" stroke="#8a857a" stroke-width="2" stroke-dasharray="7 6"/>
<text x="440" y="470" text-anchor="middle" font-size="18" fill="#5a554c">어디에도 닿지 않음</text>
<rect x="290" y="480" width="300" height="40" rx="4" fill="#ffffff" stroke="#c9c2b2" stroke-dasharray="6 5"/>
<text x="440" y="506" text-anchor="middle" font-size="18" fill="#8a857a">대응 없음 — 억지로 만들지 않는다</text>
<line x1="590" y1="500" x2="660" y2="500" stroke="#8a857a" stroke-width="2" stroke-dasharray="7 6"/>
<rect x="665" y="470" width="250" height="60" fill="#ffffff" stroke="#1a1916" stroke-width="2"/>
<text x="790" y="496" text-anchor="middle" font-size="21" fill="#1a1916">번역 잔여</text>
<text x="790" y="519" text-anchor="middle" font-size="16" fill="#5a554c">뒷면에 원문 그대로 인쇄</text>
</g>

<!-- 명함 (앞/뒤) -->
<g>
<line x1="915" y1="158" x2="985" y2="240" stroke="#1a1916" stroke-width="2"/>
<line x1="915" y1="272" x2="985" y2="280" stroke="#1a1916" stroke-width="2"/>
<line x1="915" y1="386" x2="985" y2="320" stroke="#1a1916" stroke-width="2"/>
<line x1="915" y1="500" x2="985" y2="470" stroke="#8a857a" stroke-width="2" stroke-dasharray="7 6"/>
<!-- 앞면 -->
<rect x="990" y="215" width="220" height="136" fill="#15110a"/>
<g>
<rect x="990" y="215" width="42" height="136" fill="#c2922e"/>
<rect x="1032" y="215" width="36" height="60" fill="#2f6b46"/>
<rect x="1032" y="275" width="36" height="76" fill="#201b15"/>
<rect x="1068" y="215" width="46" height="44" fill="#a8332e"/>
<rect x="1068" y="259" width="46" height="92" fill="#c2922e"/>
<rect x="1114" y="215" width="40" height="136" fill="#201b15"/>
<rect x="1154" y="215" width="56" height="70" fill="#c2922e"/>
<rect x="1154" y="285" width="56" height="66" fill="#2f6b46"/>
<g stroke="#ece2c8" stroke-width="2.4" fill="none">
<path d="M996 240 h30 M996 252 h30 M996 264 h30"/>
<path d="M1038 300 l12 -12 l12 12 l-12 12 z"/>
<path d="M1074 300 h34 M1074 312 h34 M1074 324 h34"/>
<path d="M1120 236 l7 8 l7 -8 l7 8 l7 -8"/>
<path d="M1120 254 l7 8 l7 -8 l7 8 l7 -8"/>
<rect x="1166" y="304" width="9" height="9"/>
<rect x="1184" y="304" width="9" height="9"/>
<rect x="1175" y="318" width="9" height="9"/>
</g>
</g>
<text x="1100" y="374" text-anchor="middle" font-size="17" fill="#8a857a">앞면 — 번역된 패턴</text>
<!-- 뒷면 -->
<rect x="990" y="400" width="220" height="136" fill="#f6f1e4" stroke="#c9c2b2"/>
<text x="1006" y="428" font-size="17" fill="#1a1916">○○○</text>
<line x1="1006" y1="438" x2="1194" y2="438" stroke="#c9c2b2"/>
<g font-size="11.5" fill="#5a554c">
<text x="1006" y="458">직접 — Abusua Ye Dom · 출처</text>
<text x="1006" y="476">인접 — Sika Futuro · 출처</text>
<text x="1006" y="494">잔여 — 그리움 (번역되지 않음)</text>
</g>
<text x="1006" y="522" font-size="11" fill="#8a857a">이 명함은 복제가 아니라 번역이다</text>
<text x="1100" y="560" text-anchor="middle" font-size="17" fill="#8a857a">뒷면 — 등급·출처·잔여 기록</text>
</g>

<!-- 하단 규칙 -->
<line x1="40" y1="600" x2="1200" y2="600" stroke="#ddd5c6" stroke-width="2"/>
<g font-size="18" fill="#5a554c">
<text x="60" y="638">· 판정은 공개된 묶음표만 사용 — 표 밖의 유추로 등급을 올리지 않는다</text>
<text x="60" y="668">· 판정이 애매하면 상위가 아니라 하위 등급으로 내린다</text>
<text x="60" y="698">· 같은 입력은 누가 돌려도 같은 등급이 나온다 (규칙 공개)</text>
</g>
</svg>

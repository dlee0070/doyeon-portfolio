<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관리도구 — Portfolio</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="admin.css?v=4">
</head>
<body>
  <div id="offlineBanner" class="offline-banner" hidden>
    이 페이지는 로컬 서버가 필요합니다 — 사이트 폴더의 <b>관리도구.bat</b> 을 더블클릭해서 열어 주세요.
  </div>

  <header class="bar">
    <span class="bar-title">관리도구</span>
    <span id="saveStatus" class="save-status"></span>
    <span class="bar-spacer"></span>
    <a href="/" target="_blank" class="bar-link">사이트 보기 ↗</a>
    <button id="saveBtn" class="save-btn">변경사항 저장</button>
  </header>

  <nav class="side">
    <button data-view="basic" class="side-link">기본 정보</button>
    <button data-view="works" class="side-link">Works</button>
    <button data-view="studies" class="side-link">Research</button>
    <button data-view="deploy" class="side-link">배포</button>
    <p class="side-help">
      수정 후 반드시 우측 상단<br>「변경사항 저장」을 눌러 주세요.<br><br>
      저장하면 미리보기 탭을<br>새로고침해서 확인할 수 있습니다.<br><br>
      실제 사이트에 올리려면<br>「배포」 탭에서<br>반영하기를 누르세요.
    </p>
  </nav>

  <main id="main" class="main"></main>

  <!-- 관리도구 파일을 고치면 ?v= 숫자를 올린다 — GitHub Pages 는 10분 캐시라 안 올리면 옛 코드가 돈다 -->
  <script src="github.js?v=4"></script>
  <script src="admin.js?v=4"></script>
</body>
</html>
